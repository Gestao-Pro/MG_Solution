    <script>
        // Aplica o tema do localStorage antes do React carregar para evitar FOUC (Flash of Unstyled Content)
        if (localStorage.getItem('gestaoProTheme') === 'dark' || (!('gestaoProTheme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        } else {
          document.documentElement.classList.remove('dark')
        }
    </script>
